# This workflow installs dependencies cleanly with caching, then builds the source and runs the tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build library
        run: npm run build

      - name: Summarize outcome
        if: ${{ always() }}
        run: echo "Build finished with status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  test-unit:
    name: Unit tests
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build library
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Summarize outcome
        if: ${{ always() }}
        run: echo "Unit tests finished with status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Lint code
        run: npm run lint:check

      - name: Summarize outcome
        if: ${{ always() }}
        run: echo "Lint finished with status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
