name: Set up Node
description: Install the .nvmrc Node version with the npm cache, then install dependencies.

runs:
  using: composite
  steps:
    - name: Use Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm run ci:pipeline
